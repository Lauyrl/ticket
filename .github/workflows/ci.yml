name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # create a temporary Linux VM running Ubuntu
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ticket
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: 123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ticket -d ticket"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # checkout/clone the repository into the VM
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # try to build the Spring project and run tests inside the VM
      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ticket
          SPRING_DATASOURCE_USERNAME: ticket
          SPRING_DATASOURCE_PASSWORD: password
        run: ./mvnw clean verify

      # try to build the Docker image inside the VM
      - name: Build Docker image
        run: docker build -t ticket .
