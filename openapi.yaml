# COMPONENTS & SCHEMAS
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập chuỗi JWT Access Token (không cần gõ tiền tố 'Bearer ')

  schemas:
    # Auth Schemas
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret123
        fullName:
          type: string
          example: Nguyen Van A

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: secret123

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: customer@example.com
        fullName:
          type: string
          example: Nguyen Van A
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: customer@example.com
        fullName:
          type: string
          example: Nguyen Van A
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum:
        - CUSTOMER
        - ADMIN
      example: CUSTOMER

    # Event Schemas
    EventStatus:
      type: string
      enum:
        - DRAFT
        - ON_SALE
        - COMPLETED
        - CANCELLED
      example: ON_SALE

    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        name:
          type: string
