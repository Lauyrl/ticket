openapi: 3.0.3
info:
  title: Event Ticketing Platform API
  description: |
    Đặc tả RESTful API cho Hệ thống Đặt vé Sự kiện Trực tuyến (Event Ticketing Platform).
    
    ### Tính năng chính:
    - **Xác thực & Phân quyền:** Đăng ký, đăng nhập bằng Email/Password, JWT Bearer token, làm mới token, phân quyền Customer & Admin.
    - **Sự kiện (Events):** Tìm kiếm, phân trang, lọc nâng cao theo thời gian, thành phố, danh mục; gợi ý từ khóa tìm kiếm (suggest); sự kiện trending.
    - **Sơ đồ ghế & Giữ ghế (Seat Holds):** Hiển thị sơ đồ ghế theo Seat Zone, giữ ghế tạm thời (chống tranh chấp với SELECT FOR UPDATE + UNIQUE INDEX), tự động hết hạn (lazy expiry).
    - **Đơn hàng & Thanh toán (Orders & Checkout):** Tạo đơn hàng từ SeatHold, hủy đơn pending, xác nhận thanh toán giả lập, sinh vé điện tử kèm mã QR.
    - **Vé điện tử (Tickets):** Tra cứu vé của tôi, chi tiết vé kèm QR code check-in.
    - **Thông báo (Notifications):** Danh sách thông báo in-app, đánh dấu đã đọc, xóa thông báo.
    - **Quản trị (Admin):** Quản lý sự kiện, tạo kèm Seat Zone, sơ đồ ghế, quản lý đơn hàng toàn hệ thống, dashboard phân tích doanh thu & fill rate, upload hình ảnh.
    
    ### Real-time WebSocket (STOMP over SockJS):
    - **Endpoint kết nối:** `ws://localhost:8080/ws`
    - **Subscribed Topics:**
      - `/topic/seats/{eventId}`: Cập nhật trạng thái ghế thời gian thực (Frontend - SeatSelection)
      - `/topic/admin/seats/{eventId}`: Cập nhật trạng thái ghế cho Admin
      - `/topic/admin/orders/{eventId}`: Đơn hàng mới theo sự kiện
      - `/topic/admin/orders/global`: Tất cả đơn hàng toàn hệ thống
      - `/topic/admin/dashboard/{eventId}`: Cập nhật metrics dashboard tự động
      - `/topic/events`: Thay đổi trạng thái sự kiện
      - `/topic/notifications/users/{userId}`: Thông báo real-time tới từng người dùng
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Auth
    description: Đăng ký, đăng nhập và quản lý phiên người dùng
  - name: Events (Public)
    description: Duyệt, tìm kiếm và xem chi tiết sự kiện công khai
  - name: Seats & Holds
    description: Sơ đồ ghế và cơ chế giữ chỗ tạm thời (Seat Hold)
  - name: Orders & Checkout
    description: Tạo đơn hàng, quản lý đơn hàng và thanh toán vé
  - name: Tickets
    description: Quản lý và tra cứu vé điện tử của người dùng
  - name: Notifications
    description: Thông báo người dùng
  - name: Admin - Events
    description: Quản lý sự kiện dành cho Admin
  - name: Admin - Seat Zones
    description: Quản lý khu vực ghế và sơ đồ ghế dành cho Admin
  - name: Admin - Orders
    description: Quản lý đơn hàng toàn hệ thống dành cho Admin
  - name: Admin - Dashboard & Tools
    description: Báo cáo phân tích số liệu và upload ảnh

paths:
  # 1. AUTH
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản mới
      description: Tạo tài khoản khách hàng mới bằng email và mật khẩu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công, trả về JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dữ liệu gửi lên không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email đã tồn tại trong hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập bằng Email/Password
      description: Xác thực người dùng và cấp cặp Access Token & Refresh Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Làm mới Access Token
      description: Dùng Refresh Token hợp lệ để cấp mới Access Token và Refresh Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Cấp mới token thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh Token không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Đăng xuất
      description: Thông báo đăng xuất. Vì hệ thống dùng JWT stateless, client cần tự hủy token tại local storage/cookie.
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Lấy thông tin người dùng hiện tại
      description: Trả về thông tin profile của người dùng đang đăng nhập dựa trên JWT token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Chưa xác thực hoặc Token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/seed-admin:
    post:
      tags:
        - Auth
      summary: Khởi tạo tài khoản Quản trị viên (Seed Admin)
      description: Tạo tài khoản role ADMIN nếu email chưa tồn tại; nếu đã tồn tại thì cấp token đăng nhập.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Cấp token cho Admin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # 2. EVENTS (PUBLIC)
  /api/v1/events:
    get:
      tags:
        - Events (Public)
      summary: Danh sách sự kiện công khai (Lọc và phân trang)
      description: Trả về danh sách sự kiện kèm bộ lọc theo tên, thành phố, khoảng thời gian bắt đầu/kết thúc.
      parameters:
        - name: search
          in: query
          description: Tìm kiếm theo tên hoặc mô tả sự kiện
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Lọc theo danh mục sự kiện (vd: MUSIC, WORKSHOP, SPORTS)
          required: false
          schema:
            type: string
        - name: city
          in: query
          description: Lọc theo thành phố tổ chức (vd: Hà Nội, TP. Hồ Chí Minh)
          required: false
          schema:
            type: string
        - name: startsAfter
          in: query
          description: Thời gian bắt đầu từ thời điểm này (ISO 8601 Instant)
          required: false
          schema:
            type: string
            format: date-time
        - name: startsBefore
          in: query
          description: Thời gian bắt đầu trước thời điểm này (ISO 8601 Instant)
          required: false
          schema:
            type: string
            format: date-time
        - name: endsAfter
          in: query
          description: Thời gian kết thúc sau thời điểm này (ISO 8601 Instant)
          required: false
          schema:
            type: string
            format: date-time
        - name: endsBefore
          in: query
          description: Thời gian kết thúc trước thời điểm này (ISO 8601 Instant)
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Số trang hiện tại (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Lấy danh sách sự kiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEventResponse'

  /api/v1/events/suggest:
    get:
      tags:
        - Events (Public)
      summary: Gợi ý tìm kiếm sự kiện theo từ khóa
      description: Hỗ trợ autocomplete/suggest nhanh khi người dùng đang nhập từ khóa trên ô tìm kiếm.
      parameters:
        - name: search
          in: query
          description: Từ khóa tìm kiếm
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách gợi ý sự kiện phù hợp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'

  /api/v1/events/trending:
    get:
      tags:
        - Events (Public)
      summary: Danh sách sự kiện thịnh hành (Trending)
      description: Lấy danh sách các sự kiện nổi bật, có lượng quan tâm hoặc đặt vé cao.
      responses:
        '200':
          description: Danh sách sự kiện trending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'

  /api/v1/events/{eventId}:
    get:
      tags:
        - Events (Public)
      summary: Chi tiết một sự kiện
      description: Lấy thông tin chi tiết của sự kiện bao gồm địa điểm, thời gian, mô tả và chính sách đặt vé.
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID của sự kiện
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thông tin chi tiết sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Không tìm thấy sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 3. SEATS & HOLDS
  /api/v1/events/{eventId}/seats:
    get:
      tags:
        - Seats & Holds
      summary: Lấy sơ đồ ghế của sự kiện
      description: |
        Trả về sơ đồ ghế phân theo Zone -> Hàng -> Ghế.
        Trạng thái ghế (AVAILABLE, HELD, SOLD) được tính toán thời gian thực:
        - Ghế đang HELD bởi chính user hiện tại sẽ có đánh dấu riêng.
        - Ghế có hold đã quá hạn (expired) được giải phóng thành AVAILABLE.
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID sự kiện
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sơ đồ các zone và ghế của sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatZoneResponse'
        '404':
          description: Sự kiện không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventId}/seats/{seatId}/hold:
    post:
      tags:
        - Seats & Holds
      summary: Giữ chỗ tạm thời cho một ghế (Seat Hold)
      description: |
        Tạo một phiên giữ ghế tạm thời (mặc định theo `holdDurationMinutes` của event).
        Sử dụng cơ chế `SELECT FOR UPDATE` và Unique Constraint trong Database để ngăn race condition (hai người cùng giữ 1 ghế).
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID sự kiện
          schema:
            type: integer
            format: int64
        - name: seatId
          in: path
          required: true
          description: ID của ghế muốn giữ
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Giữ ghế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHoldResponse'
        '400':
          description: Đã vượt quá số lượng ghế tối đa được phép giữ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ghế hoặc sự kiện không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ghế đã bị người khác giữ hoặc đã được mua (Conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Seats & Holds
      summary: Bỏ giữ ghế thủ công
      description: Người dùng chủ động nhả ghế đang giữ trước khi hết hạn.
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID sự kiện
          schema:
            type: integer
            format: int64
        - name: seatId
          in: path
          required: true
          description: ID của ghế muốn hủy giữ
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Hủy giữ ghế thành công
        '404':
          description: Ghế không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Người dùng không có hold ACTIVE hợp lệ trên ghế này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventId}/holds:
    get:
      tags:
        - Seats & Holds
      summary: Lấy danh sách ghế đang giữ của user trong một sự kiện
      description: Trả về danh sách các SeatHold đang ở trạng thái ACTIVE (chưa hết hạn) của người dùng hiện tại đối với sự kiện cụ thể.
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID sự kiện
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Danh sách các hold đang active
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatHoldResponse'

  /api/v1/holds/active:
    get:
      tags:
        - Seats & Holds
      summary: Lấy hold active của user theo eventId
      description: Endpoint tiện ích để kiểm tra ghế đang giữ hợp lệ trước khi checkout.
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: query
          required: true
          description: ID sự kiện
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Danh sách hold active
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatHoldResponse'

  # 4. ORDERS & CHECKOUT
  /api/v1/orders:
    post:
      tags:
        - Orders & Checkout
      summary: Tạo đơn hàng từ SeatHold
      description: Chuyển đổi một SeatHold đang ACTIVE và chưa hết hạn thành một đơn hàng ở trạng thái PENDING.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Tạo đơn hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: HoldId không hợp lệ hoặc hold đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy SeatHold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/my:
    get:
      tags:
        - Orders & Checkout
      summary: Danh sách đơn hàng của người dùng hiện tại
      description: Lấy lịch sử đơn hàng của cá nhân, sắp xếp giảm dần theo thời gian tạo.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái đơn hàng (PENDING, PAID, CANCELLED, EXPIRED)
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: page
          in: query
          description: Trang (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Số lượng mỗi trang
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách tóm tắt đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrderSummaryResponse'

  /api/v1/orders/{orderId}:
    get:
      tags:
        - Orders & Checkout
      summary: Lấy chi tiết đơn hàng
      description: Xem chi tiết đơn hàng (bao gồm danh sách items, thông tin ghế, số tiền, trạng thái).
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID đơn hàng
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thông tin chi tiết đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Đơn hàng không tồn tại hoặc không thuộc quyền sở hữu của user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Orders & Checkout
      summary: Hủy đơn hàng PENDING
      description: Cho phép hủy đơn hàng đang ở trạng thái PENDING và tự động giải phóng ghế tương ứng.
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID đơn hàng cần hủy
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Hủy đơn hàng thành công
        '400':
          description: Không thể hủy đơn hàng không ở trạng thái PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/checkout/{holdId}/confirm:
    post:
      tags:
        - Orders & Checkout
      summary: Xác nhận thanh toán giả lập
      description: |
        Xác nhận thanh toán cho đơn hàng liên quan đến holdId.
        Sau khi thanh toán thành công:
        - Order chuyển sang trạng thái `PAID`.
        - Ghế chuyển sang trạng thái `SOLD`.
        - Sinh các vé điện tử (`Ticket`) kèm mã QR định danh phục vụ check-in.
      security:
        - BearerAuth: []
      parameters:
        - name: holdId
          in: path
          required: true
          description: ID của SeatHold
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thanh toán thành công, trả về thông tin Order và Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Đơn hàng đã hết hạn hoặc không thể thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy đơn hàng / hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 5. TICKETS
  /api/v1/tickets/my:
    get:
      tags:
        - Tickets
      summary: Danh sách vé của người dùng hiện tại
      description: Lấy toàn bộ vé điện tử đã mua của người dùng hiện tại kèm mã QR.
      security:
